name: solopilot

services:
  solopilot:
    image: ghcr.io/wifsimster/solopilot:latest
    container_name: solopilot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - bot-data:/app/data
    # Every variable from .env is passed through, incl. the optional
    # GITHUB_ISSUES_TOKEN (Radar produit, ADR-0026). Secrets live in .env only.
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=production
      - WEB_PORT=3000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      lan:

volumes:
  bot-data:

networks:
  lan:
    external: true
